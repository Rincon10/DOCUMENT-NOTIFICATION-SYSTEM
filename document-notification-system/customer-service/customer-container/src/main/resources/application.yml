server:
  port: ${SERVER_PORT:8184}

logging:
  level:
    com.document.notification.system: ${APP_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

spring:
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}?currentSchema=customer&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified${DB_EXTRA_PARAMS:}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    platform: postgres
  sql:
    init:
      schema-locations: classpath:init-schema.sql
      data-locations: classpath:init-data.sql # Opcional si también necesitas insertar datos
      # Default seguro: la imagen publicada NO ejecuta los scripts de esquema ni de datos.
      # Para el primer arranque contra una BD vacia, sobreescribir la variable de entorno:
      #   mode: ${SQL_INIT_MODE:always}
      mode: ${SQL_INIT_MODE:never}

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092, localhost:29092, localhost:39092}
  schema-registry-url-key: schema.registry.url
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  num-of-partitions: ${KAFKA_NUM_PARTITIONS:3}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  # Optional security for managed Kafka (leave empty for local PLAINTEXT)
  security-protocol: ${KAFKA_SECURITY_PROTOCOL:}
  sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
  sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
  schema-registry-basic-auth-credentials-source: ${SCHEMA_REGISTRY_AUTH_SOURCE:USER_INFO}
  schema-registry-basic-auth-user-info: ${SCHEMA_REGISTRY_AUTH_USER_INFO:}

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: none
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5
