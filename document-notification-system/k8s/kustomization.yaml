apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: document-notification-system

resources:
  - namespace.yaml
  - configmap.yaml
  - document-service.yaml
  - customer-service.yaml
  - generator-service.yaml
  - notification-service.yaml

# Apuntar las imagenes al registry real sin editar los manifiestos:
#   kustomize edit set image document-notification-system/document-service=<registry>/document-service:<tag>
images:
  - name: document-notification-system/document-service
    newName: ghcr.io/OWNER/document-service
    newTag: latest
  - name: document-notification-system/customer-service
    newName: ghcr.io/OWNER/customer-service
    newTag: latest
  - name: document-notification-system/generator-service
    newName: ghcr.io/OWNER/generator-service
    newTag: latest
  - name: document-notification-system/notification-service
    newName: ghcr.io/OWNER/notification-service
    newTag: latest
