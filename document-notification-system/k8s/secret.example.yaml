# Plantilla de Secret — NO commitear valores reales.
# Crear preferiblemente con:
#   kubectl -n document-notification-system create secret generic dns-secrets \
#     --from-literal=POSTGRES_USER=... \
#     --from-literal=POSTGRES_PASSWORD=... \
#     --from-literal=MAIL_USERNAME=... \
#     --from-literal=MAIL_PASSWORD=...
# o integrarlo con el gestor de secretos del proveedor
# (Azure Key Vault / AWS Secrets Manager / GCP Secret Manager + External Secrets Operator).
apiVersion: v1
kind: Secret
metadata:
  name: dns-secrets
  namespace: document-notification-system
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "changeme"
  MAIL_USERNAME: "no-reply@example.com"
  MAIL_PASSWORD: ""
  # Requerido por notification-service con el proveedor por defecto (MAIL_PROVIDER=azure,
  # Azure Communication Services). Solo puede quedar vacio si se usa MAIL_PROVIDER=smtp:
  ACS_CONNECTION_STRING: ""
  # Para Kafka gestionado con SASL (dejar vacio si es PLAINTEXT):
  KAFKA_SECURITY_PROTOCOL: ""
  KAFKA_SASL_MECHANISM: ""
  KAFKA_SASL_JAAS_CONFIG: ""
  SCHEMA_REGISTRY_AUTH_USER_INFO: ""
