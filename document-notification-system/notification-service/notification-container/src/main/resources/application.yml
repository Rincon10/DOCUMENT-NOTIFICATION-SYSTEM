server:
  port: ${SERVER_PORT:8183}

logging:
  level:
    com.document.notification.system: ${APP_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}

notification-service:
  instance-id: ${NOTIFICATION_INSTANCE_ID:notification-1}
  notification-request-topic-name: ${NOTIFICATION_REQUEST_TOPIC:notification-request}
  notification-response-topic-name: ${NOTIFICATION_RESPONSE_TOPIC:notification-response}
  outbox-scheduler-fixed-rate: ${OUTBOX_SCHEDULER_FIXED_RATE:10000}
  outbox-scheduler-initial-delay: ${OUTBOX_SCHEDULER_INITIAL_DELAY:10000}
  mail:
    # azure (por defecto) = Azure Communication Services Email | smtp = Gmail o cualquier servidor SMTP (spring.mail.*)
    provider: ${MAIL_PROVIDER:azure}
    from: ${MAIL_FROM:no-reply@example.com}
    rate-limit:
      tokens-per-interval: ${MAIL_RATE_LIMIT_TOKENS:5}
      refill-interval-ms: ${MAIL_RATE_LIMIT_REFILL_MS:20000}
    azure:
      connection-string: ${ACS_CONNECTION_STRING:}
      operation-timeout-seconds: ${ACS_EMAIL_TIMEOUT_SECONDS:60}

spring:
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}?currentSchema=notification&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified${DB_EXTRA_PARAMS:}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    platform: postgres
  sql:
    init:
      ##schema-locations: classpath:init-schema.sql
      mode: ${SQL_INIT_MODE:always}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@example.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
        transport:
          protocol: smtp

kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092, localhost:29092, localhost:39092}
  schema-registry-url-key: schema.registry.url
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  num-of-partitions: ${KAFKA_NUM_PARTITIONS:3}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  # Optional security for managed Kafka (leave empty for local PLAINTEXT)
  security-protocol: ${KAFKA_SECURITY_PROTOCOL:}
  sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
  sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
  schema-registry-basic-auth-credentials-source: ${SCHEMA_REGISTRY_AUTH_SOURCE:USER_INFO}
  schema-registry-basic-auth-user-info: ${SCHEMA_REGISTRY_AUTH_USER_INFO:}

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  notification-consumer-group-id: notification-topic-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: ${KAFKA_CONSUMER_CONCURRENCY:3}
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 100
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150
