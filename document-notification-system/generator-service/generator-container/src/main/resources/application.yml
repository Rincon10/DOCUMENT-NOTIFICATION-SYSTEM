server:
  port: ${SERVER_PORT:8182}

logging:
  level:
    com.document.notification.system: ${APP_LOG_LEVEL:DEBUG}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

generator-service:
  generator-request-topic-name: ${GENERATOR_REQUEST_TOPIC:generator-request}
  generator-response-topic-name: ${GENERATOR_RESPONSE_TOPIC:generator-response}
  customer-topic-name: ${CUSTOMER_TOPIC:customer}
  outbox-scheduler-fixed-rate: ${OUTBOX_SCHEDULER_FIXED_RATE:10000}
  outbox-scheduler-initial-delay: ${OUTBOX_SCHEDULER_INITIAL_DELAY:10000}

spring:
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:postgres}?currentSchema=generator&binaryTransfer=true&reWriteBatchedInserts=true&stringtype=unspecified${DB_EXTRA_PARAMS:}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
    platform: postgres
  sql:
    init:
      ##schema-locations: classpath:init-schema.sql
      #data-locations: classpath:init-data.sql # Opcional si también necesitas insertar datos
      mode: ${SQL_INIT_MODE:always}
kafka-config:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092, localhost:29092, localhost:39092}
  schema-registry-url-key: schema.registry.url
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8081}
  num-of-partitions: ${KAFKA_NUM_PARTITIONS:3}
  replication-factor: ${KAFKA_REPLICATION_FACTOR:3}
  # Optional security for managed Kafka (leave empty for local PLAINTEXT)
  security-protocol: ${KAFKA_SECURITY_PROTOCOL:}
  sasl-mechanism: ${KAFKA_SASL_MECHANISM:}
  sasl-jaas-config: ${KAFKA_SASL_JAAS_CONFIG:}
  schema-registry-basic-auth-credentials-source: ${SCHEMA_REGISTRY_AUTH_SOURCE:USER_INFO}
  schema-registry-basic-auth-user-info: ${SCHEMA_REGISTRY_AUTH_USER_INFO:}

kafka-producer-config:
  key-serializer-class: org.apache.kafka.common.serialization.StringSerializer
  value-serializer-class: io.confluent.kafka.serializers.KafkaAvroSerializer
  compression-type: snappy
  acks: all
  batch-size: 16384
  batch-size-boost-factor: 100
  linger-ms: 5
  request-timeout-ms: 60000
  retry-count: 5

kafka-consumer-config:
  key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
  generator-consumer-group-id: generator-topic-consumer
  notification-consumer-group-id: notification-topic-consumer
  customer-group-id: customer-topic-consumer
  auto-offset-reset: earliest
  specific-avro-reader-key: specific.avro.reader
  specific-avro-reader: true
  batch-listener: true
  auto-startup: true
  concurrency-level: ${KAFKA_CONSUMER_CONCURRENCY:3}
  session-timeout-ms: 10000
  heartbeat-interval-ms: 3000
  max-poll-interval-ms: 300000
  max-poll-records: 500
  max-partition-fetch-bytes-default: 1048576
  max-partition-fetch-bytes-boost-factor: 1
  poll-timeout-ms: 150
