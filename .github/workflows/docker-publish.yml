# Construye y publica las 4 imagenes de los microservicios.
# Registry-agnostico: por defecto usa GHCR con GITHUB_TOKEN.
# Para ACR/ECR/Artifact Registry/Docker Hub, definir los secrets:
#   REGISTRY_URL, REGISTRY_USERNAME, REGISTRY_PASSWORD
name: Build & Push Docker Images

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_URL || 'ghcr.io' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - document-service
          - customer-service
          - generator-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          OWNER="${{ secrets.REGISTRY_NAMESPACE || github.repository_owner }}"
          echo "name=${REGISTRY}/${OWNER,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: document-notification-system
          file: document-notification-system/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
